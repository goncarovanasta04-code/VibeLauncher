<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VibeLauncher</title>
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <svg style="position: absolute; width: 0; height: 0; pointer-events: none;">
      <filter id="liquid-glass-refraction" x="-20%" y="-20%" width="140%" height="140%">
        <!-- Карта искажения: низкая частота дает гладкую линзу без зерна -->
        <feTurbulence type="fractalNoise" baseFrequency="0.02 0.02" numOctaves="1" result="noise" />
        <!-- Преломление: сдвигает пиксели фона на краях -->
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="14" xChannelSelector="R" yChannelSelector="G" result="displaced" />
        <!-- Минимальное сглаживание линзы -->
        <feGaussianBlur in="displaced" stdDeviation="1.5" />
      </filter>
    </svg>
  </body>
</html>
